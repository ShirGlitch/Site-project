<!DOCTYPE html> 
<!-- הצהרה על סוג המסמך כדי שהדפדפן ידע שמדובר במסמך HTML5 -->
<html lang="he" dir="rtl"> 
<!-- פתיחת מסמך HTML עם הגדרת שפה עברית וכיוון כתיבה מימין לשמאל -->
<head> 
    <!-- אזור ההגדרות והמטא-דאטה של הדף -->
    <meta charset="UTF-8"> 
    <!-- הגדרת קידוד UTF-8 כדי לתמוך בעברית ותווים מיוחדים -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- התאמת תצוגת האתר למכשירים ניידים ולרוחב המסך -->
    <link rel="stylesheet" href="styles.css"> 
    <!-- חיבור קובץ העיצוב CSS לדף -->
    <title>BingeList - דף הבית</title>
    <!-- כותרת הדף שמופיעה בלשונית הדפדפן -->
</head>
<!-- הגדרות האתר -->

<body id="home-page">
    <!-- גוף האתר הראשי עם מזהה ייחודי לדף הבית -->
    <header id="main-header"></header>
    <!-- אזור הכותרת העליונה של האתר, כרגע ריק ומתמלא דרך JavaScript -->
    <script type="module" src="script.js"></script>
    <!-- טעינת קובץ JavaScript כמודול לצורך הפעלת פונקציות דינמיות באתר -->

    <!-- האזור העליון של האתר - header -->
    <main> 
        <!-- התוכן המרכזי של האתר -->
        <section id="quick-add"> 
            <!-- אזור להוספה מהירה של סדרה חדשה -->
            <h2>לא מצאת סדרה? הוסף סדרה משלך</h2> 
            <!-- כותרת האזור שמזמינה את המשתמש להוסיף סדרה -->
            <form action="#" method="get"> 
                <!-- טופס לשליחת נתוני חיפוש או הוספה -->
                <label for="quickSearch">שם הסדרה:</label> 
                <!-- תווית שמחוברת לשדה החיפוש -->
                <input type="text" id="quickSearch" name="seriesName" placeholder="הקלד שם סדרה..."> 
                <!-- שדה טקסט להזנת שם סדרה -->
                <button type="submit">חפש/הוסף</button> 
                <!-- כפתור לשליחת הטופס -->
            </form>
            <p>
                או <a href="add-series.html">לחץ כאן</a> כדי למלא טופס הוספה מלא.
            </p> 
            <!-- קישור לדף נוסף שבו ניתן למלא טופס מפורט -->
        </section>

        <div id="series-catalog-container"></div>
        <!-- מיכל שבו יוצגו הסדרות לאחר טעינה או חיפוש -->

        <!-- תחילת התוכן המרכזי של האתר, טופס לחיפוש, הוספה מהירה של סדרה. -->
        <!-- הצגת הסדרות לאחר חיפוש והפעלת כפתור מידע נוסף -->
        <div id="series-modal" class="hidden" style="display: none;">
            <!-- חלון קופץ מוסתר להצגת מידע נוסף על סדרה -->
            <div class="modal-content">
                <!-- תוכן החלון הקופץ -->
                <span id="close-modal" class="close-btn">&times;</span>
                <!-- כפתור לסגירת החלון הקופץ -->
                <img id="modal-image" src="" alt="תמונת סדרה">
                <!-- תמונת הסדרה שתוצג בחלון -->
                <h2 id="modal-title"></h2>
                <!-- כותרת הסדרה בתוך החלון הקופץ -->
                <p id="modal-description"></p>
                <!-- תיאור הסדרה בתוך החלון הקופץ -->
            </div>
        </div>

        <hr> 
        <!-- קו הפרדה בין אזורים בדף -->
        <section id="latest-suggestion">
            <!-- אזור להצגת הסדרה האחרונה שנוספה -->
            <h2>סדרה אחרונה שנוספה</h2>
            <!-- כותרת האזור -->
            <article> 
                <!-- מקום להצגת פרטי הסדרה האחרונה -->
            </article>
        </section>

        <hr>
        <!-- קו הפרדה נוסף -->
        <section id="trending-catalog">
            <!-- אזור להצגת סדרות פופולריות -->
            <h2>סדרות עם הכי הרבה התעניינות 🔥</h2>
            <!-- כותרת המציגה את הסדרות הטרנדיות -->
        </section>

        <!-- הסדרה האחרונה שנוספה לאתר ואזור לסדרות הפופולריות ביותר. -->
    </main> 
</body>
</html>
