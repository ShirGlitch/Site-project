<!DOCTYPE html> 
<html lang="he" dir="rtl"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="styles.css"> 
        <title>BingeList - דף הבית</title>
    </head>
<!-- הגדרות האתר -->

<body id="home-page">
    <header id="main-header"></header>

    <script type="module" src="script.js"></script>
<!-- האזור העליון של האתר - header -->

    <main> 
        <section id="quick-add"> 
            <h2>לא מצאת סדרה? הוסף סדרה משלך</h2> 
            <form action="#" method="get"> 
                <label for="quickSearch">שם הסדרה:</label> 
                <input type="text" id="quickSearch" name="seriesName" placeholder="הקלד שם סדרה..."> 
                <button type="submit">חפש/הוסף</button> 
                </form>
            
            <p>או <a href="add-series.html">לחץ כאן</a> כדי למלא טופס הוספה מלא.</p> 
            </section>
            <div id="series-catalog-container"></div>
<!-- תחילת התוכן המרכזי של האתר, טופס לחיפוש, הוספה מהירה של סדרה. -->
 
<!-- הצגת הסדרות לאחר חיפוש והפעלת כפתור מידע נוסף -->
        <div id="series-modal" class="hidden" style="display: none;">
            <div class="modal-content">
                <span id="close-modal" class="close-btn">&times;</span>
                <img id="modal-image" src="" alt="תמונת סדרה">
                <h2 id="modal-title"></h2>
                <p id="modal-description"></p>
            </div>
    </div>

        <hr> 
        <section id="latest-suggestion">
            <h2>סדרה אחרונה שנוספה</h2>
            
            <article> 
                
            </article>
        </section>

        <hr>

        <section id="trending-catalog">
            <h2>סדרות עם הכי הרבה התעניינות 🔥</h2>
            </section>
<!-- הסדרה האחרונה שנוספה לאתר ואזור לסדרות הפופולריות ביותר. -->
    </main> 
</body>
</html>
